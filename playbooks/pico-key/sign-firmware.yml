- name: Sign firmware
  vars:
    vault_pass_file: "{{ lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') }}"
  block:
    - name: "Sign firmware: create keypair dir"
      ansible.builtin.file:
        path: "{{ dist }}"
        state: directory
        mode: "0755"

    - name: "Sign firmware: generate encrypted key0"
      ansible.builtin.import_tasks: ./sign-by-keypair.yml
      vars:
        key_name: key0

    - name: "Sign firmware: generate encrypted key1"
      ansible.builtin.import_tasks: ./sign-by-keypair.yml
      vars:
        key_name: key1

    - name: "Sign firmware: read seal outputs"
      ansible.builtin.slurp:
        src: "{{ dist }}/seal-key{{ item }}.json"
      loop: [0, 1]
      register: seal_raw

    - name: "Sign firmware: parse seal outputs"
      ansible.builtin.set_fact:
        seal0: "{{ seal_raw.results[0].content | b64decode | from_json }}"
        seal1: "{{ seal_raw.results[1].content | b64decode | from_json }}"

    - name: "Sign firmware: sanity checks"
      ansible.builtin.assert:
        that:
          - seal0.bootkey0 | length == 32
          - seal1.bootkey0 | length == 32
          - seal0.bootkey0 != seal1.bootkey0
          - "seal0.crit1 == {'secure_boot_enable': 1}"
          - "seal1.crit1 == {'secure_boot_enable': 1}"

    - name: "Sign firmware: define OTP stages"
      ansible.builtin.set_fact:
        otp_stage1: # key hashes, slots 0+1 valid
          bootkey0: "{{ seal0.bootkey0 }}"
          bootkey1: "{{ seal1.bootkey0 }}"
          boot_flags1: { key_valid: 3 }      # 0b0011
        otp_stage2: # enable secure boot (IRREVERSIBLE)
          crit1: { secure_boot_enable: 1, debug_disable: 1, secure_debug_disable: 1, glitch_detector_enable: 1, glitch_detector_sens: 3 }
        otp_stage3: # kill slots 2+3
          boot_flags1: { key_invalid: 12 }   # 0b1100
        otp_stage4: # page locks, via `picotool otp permissions --sign`
          "1": { no_key_state: 0, key_r: 0, key_w: 0, lock_bl: 1, lock_ns: 1, lock_s: 0 }
          "2": { no_key_state: 0, key_r: 0, key_w: 0, lock_bl: 1, lock_ns: 1, lock_s: 1 }

    - name: "Sign firmware: write stage files"
      ansible.builtin.copy:
        dest: "{{ dist }}/{{ item.file }}"
        content: "{{ item.data | to_nice_json }}"
        mode: "0644"
      loop:
        - { file: otp-stage-1-add-keys.json, data: "{{ otp_stage1 }}" }
        - { file: otp-stage-2-enable-secure-boot.json, data: "{{ otp_stage2 }}" }
        - { file: otp-stage-3-invalidate-slots.json, data: "{{ otp_stage3 }}" }
        - { file: otp-stage-4-lock-pages.json, data: "{{ otp_stage4 }}" }
      loop_control:
        label: "{{ item.file }}"

    - name: "Sign firmware: write combined OTP file (stages 1–3, for `otp load`)"
      ansible.builtin.copy:
        dest: "{{ dist }}/otp-all.json"
        content: >-
          {{ otp_stage1 | combine(otp_stage2, otp_stage3, recursive=true) | to_nice_json }}
        mode: "0644"

    - name: "Sign firmware: copy instructions to dist"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/instruction.md"
        dest: "{{ dist }}/README.md"
        mode: "0644"
